name: Pentimento
options:
  bundleIdPrefix: com.manoj
  deploymentTarget:
    macOS: '14.0'
settings:
  base:
    SWIFT_VERSION: '5.10'
    MACOSX_DEPLOYMENT_TARGET: '14.0'
    CODE_SIGNING_ALLOWED: NO
    # script/release.sh overrides both on the xcodebuild command line.
    MARKETING_VERSION: '0.0.0'
    CURRENT_PROJECT_VERSION: '1'
    ENABLE_USER_SCRIPT_SANDBOXING: NO
targets:
  Pentimento:
    type: application
    platform: macOS
    sources:
      - path: Pentimento
        excludes: [Resources/ExifTool/**]
      - path: Pentimento/Resources/ExifTool
        type: folder
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.manoj.pentimento
        PRODUCT_NAME: Pentimento
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Pentimento
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.photography
        INFOPLIST_KEY_NSHumanReadableCopyright: Copyright 2026 Manoj Karthick
        ENABLE_APP_SANDBOX: NO
  PentimentoTests:
    type: bundle.unit-test
    platform: macOS
    sources: [PentimentoTests]
    dependencies:
      - target: Pentimento
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.manoj.pentimento.tests
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Pentimento.app/Contents/MacOS/Pentimento"
        BUNDLE_LOADER: "$(TEST_HOST)"
schemes:
  Pentimento:
    build:
      targets:
        Pentimento: all
        PentimentoTests: [test]
    test:
      targets:
        - PentimentoTests
